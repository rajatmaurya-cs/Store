<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Software Engineering Presentation | Testing React Native & Supabase</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              react: '#61DAFB',
              supabase: '#3ECF8E',
              postgres: '#336791',
              dark: '#080B11',
              card: 'rgba(15, 23, 42, 0.75)'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #F8FAFC;
      color: #1E293B;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      overflow-x: hidden;
    }

    .slide-container {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      box-shadow: 0 4px 24px -4px rgba(15, 23, 42, 0.06);
    }

    .clean-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      transition: all 0.2s ease;
    }

    .clean-card:hover {
      border-color: #CBD5E1;
      box-shadow: 0 6px 16px -4px rgba(15, 23, 42, 0.06);
      transform: translateY(-1px);
    }

    /* Custom subtle scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #F1F5F9;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 9999px;
    }
  </style>

  <!-- Load clean separated member files -->
  <script type="text/babel" src="./src/components/Icons.js?v=1793009957"></script>
  <script type="text/babel" src="./src/data/presentationData.js?v=1793009957"></script>
  <script type="text/babel" src="./src/slides/Member1_Rajat.js?v=1793009957"></script>
  <script type="text/babel" src="./src/slides/Member2_Priyanshu.js?v=1793009957"></script>
  <script type="text/babel" src="./src/slides/Member3_Sahil.js?v=1793009957"></script>
  <script type="text/babel" src="./src/slides/Member4_Puspendar.js?v=1793009957"></script>
  <script type="text/babel" src="./src/App.js?v=1793009957"></script>
</head>
<body class="selection:bg-cyan-500/30 selection:text-cyan-200">
  <div id="root"></div>

  <!-- Render Main App -->
  <script type="text/babel">
    ReactDOM.createRoot(document.getElementById('root')).render(<window.App />);
  </script>
</body>
</html>
